name: android-debug
on:
  pull_request:
    paths:
      - 'android/**'
      - 'ANDROID_RELEASE_GUIDE_AR.md'
      - '.github/workflows/android-debug.yml'
  workflow_dispatch:
jobs:
  debug-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android API 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build Android debug APK (non-production example origin)
        working-directory: android
        run: gradle --no-daemon assembleDebug -PauraSiteUrl=https://example.org
      - name: Validate APK is generated
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
