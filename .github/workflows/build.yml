name: build

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run media:validate
      - run: bun run workout:validate
      - run: bun run pwa:validate
      - run: bun run cloud:validate
      - run: bun run realdata:validate
      - run: bun run backup:validate
      - run: bun run app:smoke
      - run: bun run typecheck
      - run: bun run build
      - run: bun run performance:validate
      - name: Build Node preview for browser smoke
        run: NITRO_PRESET=node-server bun run build
      - name: Browser smoke
        run: |
          HOST=127.0.0.1 PORT=4173 node .output/server/index.mjs > /tmp/aura-preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          READY=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            echo "Aura Fit preview failed to start"
            cat /tmp/aura-preview.log
            exit 1
          fi

          bun run browser:smoke
          bun run device:smoke
