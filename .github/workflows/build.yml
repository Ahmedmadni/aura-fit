name: build

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run media:validate
      - run: node --check scripts/generate-media-review.mjs
      - run: bun run media:review:check
      - run: bun run media-runtime:validate
      - run: bun run workout:validate
      - run: bun run session:validate
      - run: bun run recovery:validate
      - run: bun run pwa:validate
      - run: bun run cloud:validate
      - run: bun run cloud-auth:validate
      - run: bun run cloud-isolation:validate
      - run: bun run cloud-local-vault:validate
      - run: bun run cloud-conflicts:validate
      - run: bun run cloud-convergence:validate
      - run: bun run realdata:validate
      - run: bun run backup:validate
      - run: bun run app:smoke
      - run: bun run typecheck
      - run: bun run build
      - run: bun run performance:validate
      - name: Build Node preview for browser smoke
        run: NITRO_PRESET=node-server bun run build
      - name: Browser smoke
        run: |
          HOST=127.0.0.1 PORT=4173 node .output/server/index.mjs > /tmp/aura-preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          READY=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            echo "Aura Fit preview failed to start"
            cat /tmp/aura-preview.log
            exit 1
          fi

          # External runner/browser startup failures can be transient. Re-run
          # each complete smoke suite once with a fresh isolated Chrome profile;
          # deterministic test failures still fail the workflow.
          for suite in browser device; do
            PASSED=0
            for attempt in 1 2; do
              echo "Running ${suite}:smoke — attempt ${attempt}/2"
              if bun run "${suite}:smoke"; then
                PASSED=1
                break
              fi
              if [ "$attempt" -eq 1 ]; then
                echo "::warning::${suite}:smoke failed once; retrying with fresh Chrome."
                sleep 3
              fi
            done
            if [ "$PASSED" -ne 1 ]; then
              echo "::error::${suite}:smoke failed on both attempts."
              exit 1
            fi
          done
