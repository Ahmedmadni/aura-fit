name: android-offline-debug
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'offline/**'
      - 'src/**'
      - 'android-offline/**'
      - 'vite.offline.config.ts'
      - 'scripts/validate-android-offline-bundle.mjs'
      - 'scripts/browser-offline-bundle-smoke.mjs'
      - 'scripts/prepare-android-exercise-media.mjs'
      - 'scripts/validate-android-offline-media.mjs'
      - 'scripts/android-emulator-offline-smoke.mjs'
      - 'scripts/gradle-retry-429.sh'
      - 'src/data/exercise-media-map.json'
      - 'src/data/workout-guide-manifest.json'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/android-offline-debug.yml'
jobs:
  apk-offline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: bun install --frozen-lockfile
      - name: Bundle React training app inside the APK
        run: bun run offline:web:build
        env:
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_PUBLISHABLE_KEY: ''
          VITE_SUPABASE_ANON_KEY: ''
      - run: bun run offline:web:validate
      - run: bun run all-exercises-forms:validate
      # Restore only media from pinned immutable upstream commits. No secrets.
      # This runs AFTER Vite, because Vite clears its generated outDir.
      - uses: actions/cache@v4
        with:
          path: android-offline/app/src/main/assets/web/media
          key: aurafit-offline-media-7455efae41b330c265e7cd4b78dfa848e7ce5ebd-aac599224bb9780305239607ef98540b7e0ce389-v1
      - name: Bundle every approved GIF and every exercise guide frame
        run: bun run offline:media:prepare
      - name: Check all media hashes, formats and compiled offline URLs
        run: bun run offline:media:validate
      - name: Browser test with network disabled after bundle load
        run: node scripts/browser-offline-bundle-smoke.mjs
      - name: Android SDK
        run: |
          SDKMANAGER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build independent, offline-only debug APK
        run: bash scripts/gradle-retry-429.sh :app:assembleDebug
      - name: Verify packaged assets and absence of network permission
        run: |
          APK=android-offline/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -Z1 "$APK" | grep -qx 'assets/web/index.html'
          AAPT="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/35.0.0/aapt"
          "$AAPT" dump permissions "$APK" > /tmp/aura-offline-apk-permissions.txt
          if grep -q 'android.permission.INTERNET' /tmp/aura-offline-apk-permissions.txt; then
            echo 'Offline APK unexpectedly has INTERNET permission'
            exit 1
          fi
          printf 'Standalone offline guest edition. No network permission.\nPackage: com.aurafit.offline\nDoes not share Chrome/TWA data. Debug-only; not for store distribution.\n' > android-offline/app/build/outputs/apk/debug/build-info.txt
          sha256sum "$APK" > android-offline/app/build/outputs/apk/debug/apk-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: aura-fit-offline-android-debug
          path: |
            android-offline/app/build/outputs/apk/debug/app-debug.apk
            android-offline/app/build/outputs/apk/debug/apk-sha256.txt
            android-offline/app/build/outputs/apk/debug/build-info.txt
          retention-days: 7
      - name: Assert production release fails without signing credentials
        shell: bash
        run: |
          set +e
          bash scripts/gradle-retry-429.sh :app:assembleRelease > /tmp/aura-unsigned-release.log 2>&1
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 0 ] || ! grep -q "RELEASE BLOCKED" /tmp/aura-unsigned-release.log; then
            echo "::error::Unsigned release build was not explicitly blocked."
            tail -70 /tmp/aura-unsigned-release.log
            exit 1
          fi
          echo "PASS: production release refuses missing private signing credentials."
      - name: Build two upgrade QA APKs with ONE ephemeral in-job signing identity
        shell: bash
        run: |
          set -euo pipefail
          KEYFILE="$RUNNER_TEMP/aura-upgrade-qa-only.p12"
          keytool -genkeypair -noprompt -storetype PKCS12 \
            -keystore "$KEYFILE" -storepass "qa-test-only-123456" \
            -keypass "qa-test-only-123456" -alias "aura-qa-upgrade" \
            -dname "CN=Throwaway Aura Fit CI Upgrade Identity" \
            -keyalg RSA -keysize 2048 -validity 2
          export AURA_OFFLINE_QA_KEYSTORE_PATH="$KEYFILE"
          export AURA_OFFLINE_QA_STORE_PASSWORD="qa-test-only-123456"
          export AURA_OFFLINE_QA_KEY_ALIAS="aura-qa-upgrade"
          export AURA_OFFLINE_QA_KEY_PASSWORD="qa-test-only-123456"
          export AURA_OFFLINE_VERSION_NAME="qa-upgrade-only"
          TARGET="android-offline/app/build/outputs/upgrade-qa"
          mkdir -p "$TARGET"
          export AURA_OFFLINE_VERSION_CODE=10001
          bash scripts/gradle-retry-429.sh :app:assembleDebug
          cp android-offline/app/build/outputs/apk/debug/app-debug.apk "$TARGET/qa-v10001.apk"
          export AURA_OFFLINE_VERSION_CODE=10002
          bash scripts/gradle-retry-429.sh :app:assembleDebug
          cp android-offline/app/build/outputs/apk/debug/app-debug.apk "$TARGET/qa-v10002.apk"
          AAPT="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/35.0.0/aapt"
          APKSIGNER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/35.0.0/apksigner"
          for CODE in 10001 10002; do
            "$APKSIGNER" verify --verbose --print-certs "$TARGET/qa-v$CODE.apk" > "$TARGET/qa-v$CODE-signer.txt"
            "$AAPT" dump badging "$TARGET/qa-v$CODE.apk" > "$TARGET/qa-v$CODE-badging.txt"
            grep -q "versionCode='$CODE'" "$TARGET/qa-v$CODE-badging.txt"
            grep -m1 'Signer #1 certificate SHA-256 digest:' "$TARGET/qa-v$CODE-signer.txt" > "$TARGET/qa-v$CODE-certificate.txt"
          done
          cmp "$TARGET/qa-v10001-certificate.txt" "$TARGET/qa-v10002-certificate.txt"
          echo 'CI TEST ONLY; ephemeral insecure key, DO NOT INSTALL on a real phone.' > "$TARGET/DO_NOT_INSTALL.txt"
          rm -f "$KEYFILE"
      - uses: actions/upload-artifact@v4
        with:
          name: aura-fit-offline-upgrade-test-only
          path: android-offline/app/build/outputs/upgrade-qa/
          retention-days: 1


  emulator-webview:
    name: Android emulator / real WebView offline smoke
    needs: apk-offline
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: aura-fit-offline-android-debug
          path: android-artifact
      - uses: actions/download-artifact@v4
        with:
          name: aura-fit-offline-upgrade-test-only
          path: upgrade-test-only
      - name: Enable KVM for accelerated Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Boot Android 15 without Internet and verify REAL WebView
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disable-animations: true
          emulator-boot-timeout: 600
          script: node scripts/android-emulator-offline-smoke.mjs android-artifact/app-debug.apk upgrade-test-only/qa-v10001.apk upgrade-test-only/qa-v10002.apk
      - name: Upload emulator logs and screenshot if failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: aura-fit-android-emulator-diagnostics
          path: android-emulator-diagnostics/
          retention-days: 7
          if-no-files-found: ignore
