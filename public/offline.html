<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <title>Aura Fit · وضع عدم الاتصال</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, -apple-system, sans-serif; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        background: #09090b; color: #f7f7f5; padding: 24px;
      }
      main {
        width: min(100%, 430px); border: 1px solid #2a2a2e; border-radius: 28px;
        padding: 28px; background: #111114;
      }
      .badge {
        display: inline-block; color: #ccff00; border: 1px solid #405100;
        background: #1a2100; border-radius: 999px; padding: 6px 10px;
        font-size: 11px; font-weight: 800;
      }
      h1 { margin: 18px 0 8px; font-size: 30px; line-height: 1.2; }
      p { margin: 0; color: #a1a1aa; font-size: 14px; line-height: 1.8; }
      button {
        width: 100%; margin-top: 22px; border: 0; border-radius: 14px;
        padding: 14px; background: #ccff00; color: #09090b; font-weight: 900;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="badge">OFFLINE</span>
      <h1>أنت غير متصل الآن</h1>
      <p>
        الصفحات والملفات التي سبق فتحها قد تستمر بالعمل من الذاكرة المحلية.
        أعد المحاولة بعد عودة الاتصال للوصول إلى المحتوى غير المخزن.
      </p>
      <button type="button" onclick="location.reload()">إعادة المحاولة</button>
    </main>
  </body>
</html>
