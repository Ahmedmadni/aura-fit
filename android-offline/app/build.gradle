plugins {
    id 'com.android.application'
}

def bundleIndex = file('src/main/assets/web/index.html')
def mediaPack = file('src/main/assets/web/media/manifest.json')
if (!mediaPack.isFile()) {
    throw new GradleException(
        'Missing exercise GIF and frame pack: run "bun run offline:media:prepare" after offline:web:build.'
    )
}
if (!bundleIndex.isFile()) {
    throw new GradleException(
        'Missing bundled web app: run "bun run offline:web:build" from repository root before assembling offline APK.'
    )
}

android {
    namespace 'com.aurafit.offline'
    compileSdk 36
    defaultConfig {
        // Deliberately separate from com.aurafit.kinetic TWA:
        // Android WebView and Chrome do not share localStorage.
        applicationId 'com.aurafit.offline'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.3.0-offline-test'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.16.0'
}
