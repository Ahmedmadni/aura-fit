plugins {
    id 'com.android.application'
}

// Explicit, secure Android launch URL. Always use the *published* Lovable
// domain that you own. Never point production APKs at editor/preview URLs.
def siteValue = providers.gradleProperty('auraSiteUrl').orElse(providers.environmentVariable('AURA_SITE_URL')).orNull
if (!siteValue) throw new GradleException('Provide -PauraSiteUrl=https://your-published-domain or AURA_SITE_URL')
def site = new URI(siteValue)
if (site.scheme != 'https' || !site.host || site.userInfo || site.query != null || site.fragment != null || site.port != -1 || (site.path && site.path != '/')) {
    throw new GradleException('AURA_SITE_URL must be a clean HTTPS origin, without path/query/credentials')
}
def origin = "https://${site.authority}"
if (siteValue != origin && siteValue != origin + '/') {
    throw new GradleException('AURA_SITE_URL must be a canonical HTTPS origin')
}
def host = site.host.toLowerCase(java.util.Locale.ROOT)
// The placeholder is allowed only for the isolated CI compile check, never
// for site-specific APKs or release tasks. Normal local builds validate too.
def buildCheck = providers.gradleProperty('auraBuildCheck').orNull == 'true'
// Distribution targets must be domain names, not literal IP addresses;
// this also excludes link-local metadata endpoints and shared-address ranges.
def blockedHost = host ==~ /^\d+\.\d+\.\d+\.\d+$/ ||
    host ==~ /^(localhost|.*\.localhost|.*\.local|.*\.internal)$/ ||
    host.contains(':') || host ==~ /^(id-)?preview--.*/ ||
    host ==~ /^(.*\.)?(example\.(com|org|net)|lovable\.dev|github\.com|github\.io)$/
if (buildCheck) {
    def tasks = gradle.startParameter.taskNames
    if (siteValue != 'https://example.org' || tasks.isEmpty() || tasks.any { it != 'assembleDebug' && it != ':app:assembleDebug' }) {
        throw new GradleException('auraBuildCheck permits only assembleDebug at https://example.org; not a distributable build')
    }
} else if (blockedHost) {
    throw new GradleException('Use a published app origin, not a preview, private, editor or placeholder domain')
}
def assetStatements = '[{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"web","site":"' + origin + '"}}]'

android {
    namespace 'com.aurafit.kinetic'
    compileSdk 36
    defaultConfig {
        applicationId 'com.aurafit.kinetic'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
        manifestPlaceholders = [launchUrl: origin + '/']
        // Android resource compiler expects XML-escaped JSON quotes in strings.
        resValue 'string', 'asset_statements', assetStatements.replace('"', '\\"')
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.4'
}
